services:
  postgres:
    image: postgres:16-alpine
    container_name: wagering-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wagering}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wagering}
      POSTGRES_DB: ${POSTGRES_DB:-wagering}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wagering} -d ${POSTGRES_DB:-wagering}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ministack:
    image: ministackorg/ministack:1.5.28
    container_name: wagering-ministack
    ports:
      - "${AWS_ENDPOINT_PORT:-4566}:4566"

volumes:
  postgres-data: